spring.application.name=ppai-bolsines-g7

# Nuestra app corre en 8081 (la API del GPS del profe usa el 8080)
server.port=8081

# Las pantallas HTML se recargan sin reiniciar la app
spring.thymeleaf.cache=false

# ---------- Persistencia: H2 en archivo + JPA/Hibernate ----------
spring.datasource.url=jdbc:h2:file:./data/bolsinesdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# Consola web para ver las tablas: http://localhost:8081/h2-console
# (JDBC URL: jdbc:h2:file:./data/bolsinesdb  usuario: sa  sin contraseña)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- GPS Tracker XTR-4500L (API mock de la cátedra) ----------
gps.xtr.api-key=sk_xtr_9F3a7C21bE6d4A10f2c8e5b7d913

# ---------- Google Maps ----------
# La key NO se sube a GitHub: va en config/local.properties (ver README)
google.maps.api-key=
spring.config.import=optional:file:./config/local.properties
